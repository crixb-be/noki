[package]
name = "noki"
version = "1.3.0"
description = "Noki: a friendly notch for your Windows desktop"
authors = ["Cristhian Bustamante"]
license = "GPL-3.0-or-later"
readme = "../README.md"
edition = "2021"

[lib]
name = "noki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
window-vibrancy = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
windows-core = "0.62"
windows-collections = "0.3"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
chrono = "0.4"
# La app es solo para Windows: AppBar, click-through y detección de pantalla completa usan Win32.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Enumeration",
  "Devices_Radios",
  "Media_Control",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dwm",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Shutdown",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
